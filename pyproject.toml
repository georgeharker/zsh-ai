[project]
name = "zsh-ai"
version = "0.1.0"
description = "OpenAI-compatible LLM integration for zsh — Python bridge"
requires-python = ">=3.11"  # tomllib (models.py) is stdlib only from 3.11
# The streaming bridge + markdown rendering live in the `llmkit` library,
# vendored as a submodule under external/llmkit (see [tool.uv.sources]).
# zsh-ai keeps only the zsh-specific glue: models.py (its ConfigParser
# subclass + the zsh serializer) and the lib/*.zsh orchestration.
dependencies = [
    "llmkit[bridge,md]",
]

# Optional `claude_code` chat backend: the Claude Agent SDK routes
# chat/question through the `claude` CLI's auth instead of an OpenAI
# endpoint. Off by default (also needs the `claude` CLI installed);
# enable with `uv sync --extra claude`. Imported lazily by llmkit so the
# default openai path never requires it.
[project.optional-dependencies]
claude = ["llmkit[claude]"]

# Resolve llmkit from the vendored submodule, installed editable so edits
# in external/llmkit take effect without a reinstall.
[tool.uv.sources]
llmkit = { path = "external/llmkit", editable = true }

# `uv sync` installs this package (editable) into .venv/ along with
# openai. We do NOT declare a [project.scripts] entry — the auto-
# generated console-script wrapper carries Windows-launcher cruft we
# don't want in our invocation path. The plugin invokes the bridge via
# `bin/zsh-ai-llm`, a hand-written shim that execs
# `.venv/bin/python -m zsh_ai`.

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "zsh_ai"

# Dev tools: pylsp + ruff (for editor LSP) and CLI ruff/mypy for scripted
# validation. We deliberately do NOT use pyright — pylsp is the editor
# server here and ruff covers lint + format.
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "python-lsp-server>=1.10",
    "python-lsp-ruff>=2.2",
    "pylsp-mypy>=0.6",
]
