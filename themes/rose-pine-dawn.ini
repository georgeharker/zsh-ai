# rose-pine-dawn theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `rose-pine-dawn` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #907AA9
markdown.h3 = bold #907AA9
markdown.h4 = italic #907AA9
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #286983 on #FFFAF3
markdown.code_block = #286983 on #FFFAF3
markdown.block_quote = #D6827E
markdown.link = #286983
markdown.link_url = underline #286983
markdown.item.bullet = bold #907AA9
markdown.item.number = #286983
markdown.list = #286983
markdown.hr = dim
markdown.kbd = bold #E99D34
markdown.table.border = #286983
markdown.table.header = not bold #286983

[code]
theme = default
