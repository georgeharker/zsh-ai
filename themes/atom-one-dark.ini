# atom-one-dark theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `atom-one-dark` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #61AFEF
markdown.h3 = bold #61AFEF
markdown.h4 = italic #61AFEF
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #C678DD on #3B414D
markdown.code_block = #C678DD on #3B414D
markdown.block_quote = #A378C2
markdown.link = #C678DD
markdown.link_url = underline #C678DD
markdown.item.bullet = bold #61AFEF
markdown.item.number = #C678DD
markdown.list = #C678DD
markdown.hr = dim
markdown.kbd = bold #DDB25B
markdown.table.border = #C678DD
markdown.table.header = not bold #C678DD

[code]
theme = one-dark
