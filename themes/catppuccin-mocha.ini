# catppuccin-mocha theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `catppuccin-mocha` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #F5C2E7
markdown.h3 = bold #F5C2E7
markdown.h4 = italic #F5C2E7
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #CBA6F7 on #313244
markdown.code_block = #CBA6F7 on #313244
markdown.block_quote = #F9B387
markdown.link = #CBA6F7
markdown.link_url = underline #CBA6F7
markdown.item.bullet = bold #F5C2E7
markdown.item.number = #CBA6F7
markdown.list = #CBA6F7
markdown.hr = dim
markdown.kbd = bold #FAE3B0
markdown.table.border = #CBA6F7
markdown.table.header = not bold #CBA6F7

[code]
theme = monokai
