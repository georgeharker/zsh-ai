# textual-dark theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `textual-dark` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #0178D4
markdown.h3 = bold #0178D4
markdown.h4 = italic #0178D4
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #004578 on #1E1E1E
markdown.code_block = #004578 on #1E1E1E
markdown.block_quote = #FEA62B
markdown.link = #004578
markdown.link_url = underline #004578
markdown.item.bullet = bold #0178D4
markdown.item.number = #004578
markdown.list = #004578
markdown.hr = dim
markdown.kbd = bold #FEA62B
markdown.table.border = #004578
markdown.table.header = not bold #004578

[code]
theme = monokai
