# monokai theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `monokai` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #AE81FF
markdown.h3 = bold #AE81FF
markdown.h4 = italic #AE81FF
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #F82672 on #2E2E2E
markdown.code_block = #F82672 on #2E2E2E
markdown.block_quote = #66D9EF
markdown.link = #F82672
markdown.link_url = underline #F82672
markdown.item.bullet = bold #AE81FF
markdown.item.number = #F82672
markdown.list = #F82672
markdown.hr = dim
markdown.kbd = bold #FC971F
markdown.table.border = #F82672
markdown.table.header = not bold #F82672

[code]
theme = monokai
