# catppuccin-macchiato theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `catppuccin-macchiato` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #C6A0F6
markdown.h3 = bold #C6A0F6
markdown.h4 = italic #C6A0F6
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #F4A97F on #363A4F
markdown.code_block = #F4A97F on #363A4F
markdown.block_quote = #F5BDE6
markdown.link = #F4A97F
markdown.link_url = underline #F4A97F
markdown.item.bullet = bold #C6A0F6
markdown.item.number = #F4A97F
markdown.list = #F4A97F
markdown.hr = dim
markdown.kbd = bold #EED49F
markdown.table.border = #F4A97F
markdown.table.header = not bold #F4A97F

[code]
theme = monokai
