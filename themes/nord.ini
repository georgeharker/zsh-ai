# nord theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `nord` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #88C0D0
markdown.h3 = bold #88C0D0
markdown.h4 = italic #88C0D0
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #81A1C1 on #3B4252
markdown.code_block = #81A1C1 on #3B4252
markdown.block_quote = #B48EAD
markdown.link = #81A1C1
markdown.link_url = underline #81A1C1
markdown.item.bullet = bold #88C0D0
markdown.item.number = #81A1C1
markdown.list = #81A1C1
markdown.hr = dim
markdown.kbd = bold #EACB8B
markdown.table.border = #81A1C1
markdown.table.header = not bold #81A1C1

[code]
theme = nord
