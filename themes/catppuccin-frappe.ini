# catppuccin-frappe theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `catppuccin-frappe` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #CA9EE6
markdown.h3 = bold #CA9EE6
markdown.h4 = italic #CA9EE6
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #EE9F76 on #414559
markdown.code_block = #EE9F76 on #414559
markdown.block_quote = #F4B8E4
markdown.link = #EE9F76
markdown.link_url = underline #EE9F76
markdown.item.bullet = bold #CA9EE6
markdown.item.number = #EE9F76
markdown.list = #EE9F76
markdown.hr = dim
markdown.kbd = bold #E4C890
markdown.table.border = #EE9F76
markdown.table.header = not bold #EE9F76

[code]
theme = monokai
