# atom-one-light theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `atom-one-light` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #4078F2
markdown.h3 = bold #4078F2
markdown.h4 = italic #4078F2
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #A626A4 on #E0E0E0
markdown.code_block = #A626A4 on #E0E0E0
markdown.block_quote = #BE9232
markdown.link = #A626A4
markdown.link_url = underline #A626A4
markdown.item.bullet = bold #4078F2
markdown.item.number = #A626A4
markdown.list = #A626A4
markdown.hr = dim
markdown.kbd = bold #D7D938
markdown.table.border = #A626A4
markdown.table.header = not bold #A626A4

[code]
theme = default
