# ansi-dark theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `ansi-dark` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline blue
markdown.h3 = bold blue
markdown.h4 = italic blue
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold cyan
markdown.code_block = cyan
markdown.block_quote = green
markdown.link = cyan
markdown.link_url = underline cyan
markdown.item.bullet = bold blue
markdown.item.number = cyan
markdown.list = cyan
markdown.hr = dim
markdown.kbd = bold yellow
markdown.table.border = cyan
markdown.table.header = not bold cyan

[code]
theme = ansi_dark
