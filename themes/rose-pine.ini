# rose-pine theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `rose-pine` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #C4A7E7
markdown.h3 = bold #C4A7E7
markdown.h4 = italic #C4A7E7
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #31748F on #1F1D2E
markdown.code_block = #31748F on #1F1D2E
markdown.block_quote = #EBBCBA
markdown.link = #31748F
markdown.link_url = underline #31748F
markdown.item.bullet = bold #C4A7E7
markdown.item.number = #31748F
markdown.list = #31748F
markdown.hr = dim
markdown.kbd = bold #F5C177
markdown.table.border = #31748F
markdown.table.header = not bold #31748F

[code]
theme = monokai
