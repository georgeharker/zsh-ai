# solarized-dark theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `solarized-dark` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #268BD2
markdown.h3 = bold #268BD2
markdown.h4 = italic #268BD2
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #2AA198 on #073642
markdown.code_block = #2AA198 on #073642
markdown.block_quote = #6C71C4
markdown.link = #2AA198
markdown.link_url = underline #2AA198
markdown.item.bullet = bold #268BD2
markdown.item.number = #2AA198
markdown.list = #2AA198
markdown.hr = dim
markdown.kbd = bold #CA4B16
markdown.table.border = #2AA198
markdown.table.header = not bold #2AA198

[code]
theme = solarized-dark
