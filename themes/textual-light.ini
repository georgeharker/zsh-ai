# textual-light theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `textual-light` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #004578
markdown.h3 = bold #004578
markdown.h4 = italic #004578
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #0178D4 on #D8D8D8
markdown.code_block = #0178D4 on #D8D8D8
markdown.block_quote = #FEA62B
markdown.link = #0178D4
markdown.link_url = underline #0178D4
markdown.item.bullet = bold #004578
markdown.item.number = #0178D4
markdown.list = #0178D4
markdown.hr = dim
markdown.kbd = bold #FEA62B
markdown.table.border = #0178D4
markdown.table.header = not bold #0178D4

[code]
theme = default
