# gruvbox theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `gruvbox` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #85A598
markdown.h3 = bold #85A598
markdown.h4 = italic #85A598
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #A89A85 on #3C3836
markdown.code_block = #A89A85 on #3C3836
markdown.block_quote = #F9BD2F
markdown.link = #A89A85
markdown.link_url = underline #A89A85
markdown.item.bullet = bold #85A598
markdown.item.number = #A89A85
markdown.list = #A89A85
markdown.hr = dim
markdown.kbd = bold #FD8019
markdown.table.border = #A89A85
markdown.table.header = not bold #A89A85

[code]
theme = gruvbox-dark
