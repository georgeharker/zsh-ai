# flexoki theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `flexoki` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #205EA6
markdown.h3 = bold #205EA6
markdown.h4 = italic #205EA6
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #24837B on #1C1B1A
markdown.code_block = #24837B on #1C1B1A
markdown.block_quote = #9B76C8
markdown.link = #24837B
markdown.link_url = underline #24837B
markdown.item.bullet = bold #205EA6
markdown.item.number = #24837B
markdown.list = #24837B
markdown.hr = dim
markdown.kbd = bold #AC8301
markdown.table.border = #24837B
markdown.table.header = not bold #24837B

[code]
theme = monokai
