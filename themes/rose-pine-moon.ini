# rose-pine-moon theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `rose-pine-moon` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #C4A7E7
markdown.h3 = bold #C4A7E7
markdown.h4 = italic #C4A7E7
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #3E8FB0 on #2A273F
markdown.code_block = #3E8FB0 on #2A273F
markdown.block_quote = #EA9A97
markdown.link = #3E8FB0
markdown.link_url = underline #3E8FB0
markdown.item.bullet = bold #C4A7E7
markdown.item.number = #3E8FB0
markdown.list = #3E8FB0
markdown.hr = dim
markdown.kbd = bold #F5C177
markdown.table.border = #3E8FB0
markdown.table.header = not bold #3E8FB0

[code]
theme = monokai
