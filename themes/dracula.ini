# dracula theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `dracula` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #BD93F9
markdown.h3 = bold #BD93F9
markdown.h4 = italic #BD93F9
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #6272A4 on #2B2E3B
markdown.code_block = #6272A4 on #2B2E3B
markdown.block_quote = #FF79C6
markdown.link = #6272A4
markdown.link_url = underline #6272A4
markdown.item.bullet = bold #BD93F9
markdown.item.number = #6272A4
markdown.list = #6272A4
markdown.hr = dim
markdown.kbd = bold #FEB86C
markdown.table.border = #6272A4
markdown.table.header = not bold #6272A4

[code]
theme = dracula
