# tokyo-night theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `tokyo-night` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #BB9AF7
markdown.h3 = bold #BB9AF7
markdown.h4 = italic #BB9AF7
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #7AA2F7 on #24283B
markdown.code_block = #7AA2F7 on #24283B
markdown.block_quote = #FE9E64
markdown.link = #7AA2F7
markdown.link_url = underline #7AA2F7
markdown.item.bullet = bold #BB9AF7
markdown.item.number = #7AA2F7
markdown.list = #7AA2F7
markdown.hr = dim
markdown.kbd = bold #DFAF68
markdown.table.border = #7AA2F7
markdown.table.header = not bold #7AA2F7

[code]
theme = one-dark
