# catppuccin-latte theme for bin/mdrender (Rich), generated by themes/generate.py
# from Textual's built-in `catppuccin-latte` palette. The same name themes both
# mdview (TEXTUAL_THEME) and mdrender (this file). [styles] layers on top
# of Rich's defaults (inherit=True); [code] is the Pygments style used
# for fenced code blocks.

[styles]
markdown.h1 = bold underline
markdown.h2 = underline #8839EF
markdown.h3 = bold #8839EF
markdown.h4 = italic #8839EF
markdown.h5 = italic
markdown.h6 = dim
markdown.h7 = dim italic
markdown.code = bold #DB8A78 on #E6E9EF
markdown.code_block = #DB8A78 on #E6E9EF
markdown.block_quote = #FD640B
markdown.link = #DB8A78
markdown.link_url = underline #DB8A78
markdown.item.bullet = bold #8839EF
markdown.item.number = #DB8A78
markdown.list = #DB8A78
markdown.hr = dim
markdown.kbd = bold #DE8E1D
markdown.table.border = #DB8A78
markdown.table.header = not bold #DB8A78

[code]
theme = default
